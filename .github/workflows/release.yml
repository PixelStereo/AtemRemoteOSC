name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # build only, no release

permissions:
  contents: read

env:
  QT_VERSION: 6.10.3

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            asset: AtemRemoteOSC-macos-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}.zip
          - name: Windows
            os: windows-latest
            qt_arch: win64_msvc2022_64
            asset: AtemRemoteOSC-windows-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}-Setup.exe
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags: a manual build counts commits since the last release
          submodules: true # third_party/pxs

      - name: Check the Blackmagic SDK headers are in the repository
        shell: bash
        run: test -d "sdk/Blackmagic ATEM Switchers SDK 11.0" || { echo "::error::sdk/ is missing from the repository (macOS and Windows builds need it)"; exit 1; }

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          cache: true

      # A tag build is called "AtemRemoteOSC 5.0.6"; a manual build also carries its commits since the release ("5.0.6+3")
      - name: Configure
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DATEMREMOTEOSC_TAG_VERSION="${GITHUB_REF_NAME#v}"
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

      # macOS: Qt deployed, everything signed ad hoc (without it the downloaded app is "damaged"), zipped with ditto
      - name: Package (macOS)
        if: matrix.name == 'macOS'
        run: scripts/package-macos.sh build/application.json build "${{ matrix.asset }}"

      # Windows: Qt deployed next to the executable, then a per-user NSIS installer (no administrator rights),
      # installed silently on the runner and launched once before it is published
      - name: Package (Windows)
        if: matrix.name == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = Get-Content build/application.json | ConvertFrom-Json
          New-Item -ItemType Directory -Path dist/package -Force | Out-Null
          Copy-Item "build/Release/$($app.executable)" dist/package/
          windeployqt --release --no-translations --no-compiler-runtime "dist/package/$($app.executable)"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Nothing to install for the user: the Visual C++ runtime DLLs live next to the executable
          $redist = if ($env:VCToolsRedistDir) { Join-Path $env:VCToolsRedistDir "x64" } else {
            (Get-ChildItem "${env:ProgramFiles}/Microsoft Visual Studio/*/*/VC/Redist/MSVC/*/x64" -Directory | Sort-Object FullName | Select-Object -Last 1).FullName }
          $crt = Get-ChildItem $redist -Directory -Filter "Microsoft.VC*.CRT" | Select-Object -First 1
          if (!$crt) { throw "Microsoft Visual C++ runtime DLLs are missing from the build environment" }
          Copy-Item (Join-Path $crt.FullName "*.dll") -Destination dist/package -Force
          Get-ChildItem dist/package -Recurse -Filter "vc_redist*.exe" -ErrorAction SilentlyContinue | Remove-Item -Force
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'
          $setup = Join-Path $PWD '${{ matrix.asset }}'
          & $compiler "/DPRODUCT=AtemRemoteOSC" "/DAPP_VERSION=$($app.version)" "/DAPP_EXE=$($app.executable)" "/DPAYLOAD=$PWD\dist\package" "/DOUTPUT=$setup" third_party/pxs/packaging/windows.nsi
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $clean = Join-Path $env:RUNNER_TEMP 'installed'
          $installer = Start-Process -FilePath $setup -ArgumentList "/S /CurrentUser /D=$clean" -Wait -PassThru
          if ($installer.ExitCode) { throw "Installer failed: $($installer.ExitCode)" }
          if (!(Test-Path (Join-Path $clean "app/$($app.executable)"))) { throw 'The installed executable is missing' }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true

  # The download links of the README and the VERSION file follow the latest release
  downloads:
    name: Update the download links
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-downloads
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Update the README and VERSION on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin "$DEFAULT_BRANCH"
            git reset --hard FETCH_HEAD
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
              python3 .github/scripts/release_downloads.py "$GITHUB_REPOSITORY"
            if git diff --quiet -- README.md VERSION; then exit 0; fi
            git add README.md VERSION
            git commit -m 'chore: synchronize release version and download links'
            if git push origin "HEAD:$DEFAULT_BRANCH"; then exit 0; fi
          done
          exit 1
